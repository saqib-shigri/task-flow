<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro – Working</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-slate-100 min-h-screen p-5">
<div id="app" class="max-w-6xl mx-auto"></div>

<script>
  // 🔁 YOUR FIREBASE CONFIG (already pasted)
  const firebaseConfig = {
    apiKey: "AIzaSyChQUqU54ApeLbKmQuAsgga5Q6MQsJWa-Q",
    authDomain: "taskflowfinal-c46fb.firebaseapp.com",
    projectId: "taskflowfinal-c46fb",
    storageBucket: "taskflowfinal-c46fb.firebasestorage.app",
    messagingSenderId: "257390066549",
    appId: "1:257390066549:web:dfe5f8c05d459a7cd8713c"
  };
  // ----------------------------------------------------

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // Test Firestore connection
  testFirestore();

  async function testFirestore() {
    try {
      await db.collection('_test').doc('ping').set({ ok: true });
      console.log('Firestore OK');
      startApp();
    } catch (err) {
      document.getElementById('app').innerHTML = `
        <div class="bg-red-100 p-4 rounded">
          <p><strong>❌ Firebase Error:</strong> ${err.message}</p>
          <p>👉 Make sure:</p>
          <ul class="list-disc pl-5">
            <li>Firestore Rules are <code>allow read, write: if true;</code> (test mode)</li>
            <li>Authentication: Email/Password is ENABLED</li>
            <li>Config is copied from the correct project</li>
          </ul>
        </div>`;
    }
  }

  // ----- FULL APP (only after test passes) -----
  let currentUser = null, currentCompanyId = null, employees = [], tasks = [], companies = [];

  async function loadCompanies() {
    const snap = await db.collection("companies").get();
    companies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function loadCompanyData(cid) {
    const empSnap = await db.collection("users").where("companyId", "==", cid).get();
    employees = empSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const taskSnap = await db.collection("tasks").where("companyId", "==", cid).get();
    tasks = taskSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function setSession(user) {
    currentUser = user;
    if (user && user.uid !== "super") {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        currentCompanyId = doc.data().companyId;
        await loadCompanyData(currentCompanyId);
      }
    } else if (user && user.uid === "super") {
      currentCompanyId = null; employees = []; tasks = [];
      await loadCompanies();
    } else {
      currentCompanyId = null; employees = []; tasks = [];
    }
    renderApp();
  }

  auth.onAuthStateChanged(async (u) => {
    if (u) {
      const doc = await db.collection("users").doc(u.uid).get();
      const role = doc.exists ? doc.data().role : "employee";
      const name = doc.exists ? doc.data().name : u.email;
      await setSession({ uid: u.uid, email: u.email, role, name });
    } else { await setSession(null); }
  });

  const SUPER_EMAIL = "super@taskflow.com", SUPER_PASSWORD = "super123";
  async function loginSuper(email, pwd) {
    if (email === SUPER_EMAIL && pwd === SUPER_PASSWORD) {
      await setSession({ uid: "super", email: SUPER_EMAIL, role: "super", name: "System Owner" });
      return true;
    }
    return false;
  }
  async function loginToCompany(cid, email, pwd) {
    try {
      const cred = await auth.signInWithEmailAndPassword(email, pwd);
      const doc = await db.collection("users").doc(cred.user.uid).get();
      if (!doc.exists || doc.data().companyId !== cid) {
        await auth.signOut();
        alert("Not authorized for this company");
        return false;
      }
      return true;
    } catch (err) { alert("Login failed: " + err.message); return false; }
  }
  async function logout() {
    if (currentUser && currentUser.uid !== "super") await auth.signOut();
    else currentUser = null;
    renderApp();
  }

  async function addCompany(name) {
    if (!name) return alert("Company name required");
    await db.collection("companies").add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await loadCompanies();
    renderApp();
  }
  async function deleteCompany(cid) {
    if (confirm("Delete company & all data?")) {
      const users = await db.collection("users").where("companyId", "==", cid).get();
      const tasksSnap = await db.collection("tasks").where("companyId", "==", cid).get();
      const batch = db.batch();
      users.docs.forEach(d => batch.delete(d.ref));
      tasksSnap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      await db.collection("companies").doc(cid).delete();
      await loadCompanies();
      if (currentCompanyId === cid) currentCompanyId = null;
      renderApp();
    }
  }

  async function addEmployee(name, email, pwd, role) {
    if (!name || !email || !pwd) return alert("All fields required");
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pwd);
      await db.collection("users").doc(cred.user.uid).set({
        name, email, role, companyId: currentCompanyId, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await loadCompanyData(currentCompanyId);
      renderApp();
    } catch (err) { alert(err.message); }
  }
  async function deleteEmployee(empId) {
    if (currentUser.uid === empId) { alert("Cannot delete self"); return; }
    await db.collection("users").doc(empId).delete();
    const tasksSnap = await db.collection("tasks").where("employeeId", "==", empId).get();
    const batch = db.batch();
    tasksSnap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    await loadCompanyData(currentCompanyId);
    renderApp();
  }

  async function saveOrUpdateTask(empId, date, text, status) {
    const existing = tasks.find(t => t.employeeId === empId && t.date === date);
    if (existing) await db.collection("tasks").doc(existing.id).update({ taskText: text, status });
    else await db.collection("tasks").add({ employeeId: empId, companyId: currentCompanyId, date, taskText: text, status, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await loadCompanyData(currentCompanyId);
    renderApp();
  }
  function getEmployeeTasks(empId) { return tasks.filter(t => t.employeeId === empId).sort((a,b) => b.date.localeCompare(a.date)); }
  function getTasksByDate(date) {
    return tasks.filter(t => t.date === date).map(t => {
      const emp = employees.find(e => e.id === t.employeeId);
      return { ...t, employeeName: emp ? emp.name : "Deleted" };
    });
  }
  function exportToExcel() {
    const empData = employees.map(e => ({ ID: e.id, Name: e.name, Email: e.email, Role: e.role }));
    const taskData = tasks.map(t => {
      const emp = employees.find(e => e.id === t.employeeId);
      return { Employee: emp ? emp.name : "Deleted", Date: t.date, Task: t.taskText, Status: t.status === "leave" ? "Leave" : "Present" };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(empData), "Employees");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taskData), "Tasks");
    XLSX.writeFile(wb, `TaskFlow_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // UI rendering functions (simplified but complete)
  function renderLoginScreen() {
    const opts = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    return `<div class="bg-white p-6 rounded-2xl shadow-xl max-w-2xl mx-auto mt-10"><h1 class="text-2xl font-bold text-center">TaskFlow</h1>
      <div class="grid md:grid-cols-2 gap-4 mt-4">
        <div><h3 class="font-bold">Admin Login</h3><form id="adminForm"><select id="adminCid" class="w-full border p-2 rounded">${opts}</select><input id="adminEmail" placeholder="Email" class="w-full border p-2 mt-2"><input id="adminPwd" type="password" placeholder="Password" class="w-full border p-2 mt-2"><button class="bg-blue-600 text-white w-full mt-2 py-1 rounded">Login</button></form></div>
        <div><h3 class="font-bold">Employee Login</h3><form id="empForm"><select id="empCid" class="w-full border p-2 rounded">${opts}</select><input id="empEmail" placeholder="Email" class="w-full border p-2 mt-2"><input id="empPwd" type="password" placeholder="Password" class="w-full border p-2 mt-2"><button class="bg-green-600 text-white w-full mt-2 py-1 rounded">Login</button></form></div>
      </div>
      <div class="text-center mt-4"><button id="ownerBtn" class="underline">Owner Login</button></div></div>`;
  }
  function attachLoginEvents() {
    document.getElementById("adminForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      await loginToCompany(document.getElementById("adminCid").value, document.getElementById("adminEmail").value, document.getElementById("adminPwd").value);
    });
    document.getElementById("empForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      await loginToCompany(document.getElementById("empCid").value, document.getElementById("empEmail").value, document.getElementById("empPwd").value);
    });
    document.getElementById("ownerBtn")?.addEventListener("click", () => {
      const e = prompt("Owner email:"), p = prompt("Password:");
      if (e === SUPER_EMAIL && p === SUPER_PASSWORD) loginSuper(e, p);
      else alert("Invalid");
    });
  }

  function renderSuper() {
    return `<div class="bg-white p-6 rounded-2xl"><div class="flex justify-between"><h2 class="text-xl font-bold">Owner Dashboard</h2><button id="logoutSuper" class="border px-2 py-1 rounded">Logout</button></div><button id="addCompanyBtn" class="bg-blue-600 text-white px-3 py-1 rounded my-2">+ Add Company</button><div>${companies.map(c => `<div class="flex justify-between border-b py-1"><span>${c.name}</span><button class="delComp text-red-500" data-id="${c.id}">Delete</button></div>`).join('')}</div></div>`;
  }
  function attachSuperEvents() {
    document.getElementById("logoutSuper")?.addEventListener("click", logout);
    document.getElementById("addCompanyBtn")?.addEventListener("click", () => { const n = prompt("Company name"); if(n) addCompany(n); });
    document.querySelectorAll(".delComp").forEach(btn => btn.addEventListener("click", (e) => deleteCompany(btn.dataset.id)));
  }

  let adminDate = new Date().toISOString().slice(0,10), filter = 'all';
  function renderAdmin() {
    const dayTasks = getTasksByDate(adminDate);
    const filteredEmps = employees.filter(e => filter==='all'?true:(filter==='submitted'?dayTasks.some(t=>t.employeeId===e.id):!dayTasks.some(t=>t.employeeId===e.id)));
    return `<div class="bg-white p-6 rounded-2xl"><div class="flex justify-between"><h2 class="text-xl font-bold">Admin · ${companies.find(c=>c.id===currentCompanyId)?.name}</h2><div><button id="exportAdmin" class="bg-gray-700 text-white px-2 py-1 rounded">Excel</button><button id="logoutAdmin" class="border px-2 py-1 rounded ml-2">Logout</button></div></div>
      <div class="flex gap-2 my-3"><button id="addEmpBtn" class="bg-indigo-600 text-white px-3 py-1 rounded">+ Employee</button><input type="date" id="datePick" value="${adminDate}" class="border p-1 rounded"></div>
      <div class="flex gap-2 my-2"><span class="cursor-pointer border px-2 py-1 ${filter==='all'?'bg-blue-100':''}" data-filter="all">All (${employees.length})</span><span class="cursor-pointer border px-2 py-1 ${filter==='submitted'?'bg-green-100':''}" data-filter="submitted">Submitted (${dayTasks.length})</span><span class="cursor-pointer border px-2 py-1 ${filter==='pending'?'bg-yellow-100':''}" data-filter="pending">Pending (${employees.length-dayTasks.length})</span></div>
      <div class="overflow-auto"><table class="min-w-full border"><thead class="bg-gray-200"><tr><th class="p-2">Employee</th><th class="p-2">Task</th><th class="p-2">Status</th><th class="p-2">✓</th></tr></thead><tbody>${filteredEmps.map(e=>{const t=dayTasks.find(d=>d.employeeId===e.id); return `<tr><td class="p-2 border">${e.name}</td><td class="p-2 border">${t?t.taskText:'—'}</td><td class="p-2 border">${t?(t.status==='leave'?'Leave':'Present'):'No task'}</td><td class="p-2 border text-center"><input type="checkbox" ${t?'checked':''} disabled></td><tr>`;}).join('')}</tbody></table></div></div>`;
  }
  function attachAdminEvents() {
    document.getElementById("exportAdmin")?.addEventListener("click", exportToExcel);
    document.getElementById("logoutAdmin")?.addEventListener("click", logout);
    document.getElementById("addEmpBtn")?.addEventListener("click", () => {
      const name = prompt("Name"), email = prompt("Email"), pwd = prompt("Password"), role = confirm("Admin? (Ok=Admin, Cancel=Employee)") ? "admin" : "employee";
      if(name && email && pwd) addEmployee(name, email, pwd, role);
    });
    document.getElementById("datePick")?.addEventListener("change", (e) => { adminDate = e.target.value; filter='all'; renderApp(); });
    document.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("click", (e) => { filter = e.target.dataset.filter; renderApp(); }));
  }

  function renderEmployee() {
    const today = new Date().toISOString().slice(0,10);
    const myTasks = getEmployeeTasks(currentUser.uid);
    const todayTask = tasks.find(t => t.employeeId === currentUser.uid && t.date === today);
    return `<div class="bg-white p-6 rounded-2xl max-w-2xl mx-auto"><div class="flex justify-between"><h2 class="text-xl font-bold">Hi, ${currentUser.name}</h2><button id="empLogout" class="border px-2 py-1 rounded">Logout</button></div>
      <div class="bg-blue-50 p-4 rounded my-4"><h3>Today: ${today}</h3><form id="taskForm"><textarea id="taskDesc" class="w-full border p-2 rounded">${todayTask?todayTask.taskText:''}</textarea><label><input type="checkbox" id="leaveChk" ${todayTask?.status==='leave'?'checked':''}> On Leave</label><button class="bg-blue-600 text-white px-3 py-1 rounded mt-2">Save</button></form><div>Submitted: ${todayTask?'✅ Yes':'❌ No'}</div></div>
      <h3 class="font-bold">History</h3><table class="w-full border"><thead class="bg-gray-200"><tr><th>Date</th><th>Task</th><th>Status</th></tr></thead><tbody>${myTasks.map(t=>`<tr><td class="border p-1">${t.date}</td><td class="border p-1">${t.taskText.substring(0,50)}</td><td class="border p-1">${t.status==='leave'?'Leave':'Present'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function attachEmployeeEvents() {
    document.getElementById("empLogout")?.addEventListener("click", logout);
    document.getElementById("taskForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = document.getElementById("taskDesc").value.trim();
      const date = new Date().toISOString().slice(0,10);
      const status = document.getElementById("leaveChk").checked ? "leave" : "present";
      if(!text && status==="present") return alert("Please enter task or mark leave");
      await saveOrUpdateTask(currentUser.uid, date, text||"Leave day", status);
    });
  }

  async function startApp() {
    await loadCompanies();
    renderApp();
  }

  function renderApp() {
    const root = document.getElementById("app");
    if(!root) return;
    if(!currentUser) { root.innerHTML = renderLoginScreen(); attachLoginEvents(); return; }
    if(currentUser.role === "super") { root.innerHTML = renderSuper(); attachSuperEvents(); return; }
    if(currentUser.role === "admin") { root.innerHTML = renderAdmin(); attachAdminEvents(); return; }
    if(currentUser.role === "employee") { root.innerHTML = renderEmployee(); attachEmployeeEvents(); return; }
  }
</script>
</body>
</html>
